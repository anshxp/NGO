name: Production Quality

on:
  push:
    branches: [master, production-hardening]
  pull_request:
    branches: [master, production-hardening]

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository hygiene
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(node_modules|dist)/'; then
            echo "Tracked dependency/build artifacts detected. Remove them from Git."
            exit 1
          fi
          if git ls-files | grep -E '^(frontend/src/.*\\.(ts|tsx)$|backend/src/.*\\.ts$)'; then
            echo "TypeScript application source detected after the JavaScript migration."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Verify production entrypoint
        run: npm run check
      - name: Verify dependency security
        run: npm audit --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify production bundle exists
        run: test -f dist/index.html
      - name: Verify dependency security
        run: npm audit --audit-level=high
