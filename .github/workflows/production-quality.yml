name: Production Quality

on:
  push:
    branches: [master, production-hardening]
  pull_request:
    branches: [master, production-hardening]

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository hygiene
        shell: bash
        run: |
          if find . -type d \( -name node_modules -o -name dist \) -not -path './.git/*' -print -quit | grep -q .; then
            echo "Dependency/build artifacts detected in the checkout."
            exit 1
          fi

          # The application is being migrated incrementally from TypeScript to
          # JavaScript. Do not fail the production gate merely because a legacy
          # .ts/.tsx file remains in the tree; instead, fail if an application
          # entrypoint still directly references a TypeScript source file.
          active_ts_refs=$(git grep -n -E '\.(ts|tsx)(["'"'"'`]|$)' -- frontend/src backend/src \
            ':(exclude)frontend/src/**/*.ts' ':(exclude)frontend/src/**/*.tsx' \
            ':(exclude)backend/src/**/*.ts' ':(exclude)backend/src/**/*.tsx' 2>/dev/null || true)
          if [ -n "$active_ts_refs" ]; then
            echo "Active JavaScript application code still references TypeScript source files:"
            echo "$active_ts_refs"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Verify production entrypoint
        run: npm run check
      - name: Verify dependency security
        run: npm audit --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify production bundle exists
        run: test -f dist/index.html
      - name: Verify dependency security
        run: npm audit --audit-level=high
